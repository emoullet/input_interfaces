joy_playability:
  ros__parameters:
    device_name: "Xbox 360 Controller"
    # Apply the dead zone only once, in joystick_mapper.
    deadzone: 0.0
    autorepeat_rate: 50.0

joystick_mapper:
  ros__parameters:
    joy_topic: /joy/playability
    output_topic: /face_joystick_cartesian_command
    mode_request_topic: /mode_request
    deadzone: 0.2
    modes:
      names: [b1, b2]
      b1:
        angular_output_frame_id: base_link
        axes:
          linear_x: {index: 1, scale: 1.0}
          linear_y: {index: 0, scale: 1.0}
          linear_z: {index: -1, scale: 1.0}
          angular_x: {index: -1, scale: 1.0}
          angular_y: {index: -1, scale: 1.0}
          angular_z: {index: -1, scale: 1.0}
      b2:
        angular_output_frame_id: end_effector_link
        axes:
          linear_x: {index: -1, scale: 1.0}
          linear_y: {index: -1, scale: 1.0}
          linear_z: {index: 1, scale: 1.0}
          angular_x: {index: -1, scale: 1.0}
          angular_y: {index: -1, scale: 1.0}
          angular_z: {index: 0, scale: 1.0}
    snake_button_index: 2
    snake_button_mode: hold
    local_mode_button_index: 1
    local_mode_button_mode: toggle
    gripper_button_index: 0
    gripper_button_mode: toggle
    gripper_command_topic: "/gripper_controller/commands"
    gripper_open_position: 0.0
    gripper_close_position: 0.8
    debug: false
